# Cowrie overrides (~/my-honeypot/etc/cowrie.cfg on the Pi)
# Only changed keys are listed; everything else uses Cowrie's built-in defaults.
# JSON logging (var/log/cowrie/cowrie.json) is enabled by default.

[honeypot]
# Believable hostname; a database server is tempting bait
hostname = srv-db01

[ssh]
# Listen on the standard SSH port (real SSH moved to 22222).
# IPv4 only. Port 22 is granted to the cowrie user via authbind.
listen_endpoints = tcp:22:interface=0.0.0.0
